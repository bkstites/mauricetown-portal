name: Security

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail on critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect hard-coded credentials in source files
        run: |
          # Scan only TS/JS source files — .env.example is a template and intentionally excluded
          if git grep -nE 'postgresql://[^"[:space:]]+:[^"@[:space:]]{6,}@' \
              -- '*.ts' '*.tsx' '*.js' '*.jsx' 2>/dev/null | \
              grep -vE 'placeholder|localhost|example\.com'; then
            echo "ERROR: Hard-coded database credentials found in source files."
            exit 1
          fi
          echo "Secret scan passed — no hard-coded credentials in source files."
